<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>결재 알림 설치 도우미</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* 레이아웃: 왼쪽 단계 목록(휴대폰에선 위쪽 가로 띠) + 오른쪽 한 단계씩 넘기는 카드 */
:root{
  --bg:#f3f5f2; --panel:#ffffff; --ink:#1f2a27; --muted:#5d6b66; --line:#d9e0dc;
  --accent:#1d6b5c; --accent-ink:#ffffff; --accent-soft:#e3efeb;
  --warn:#9a5a00; --warn-soft:#fbf1df; --code-bg:#1e2624; --code-ink:#e6efe9;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a18; --panel:#1c2421; --ink:#e7eeeb; --muted:#9fb0aa; --line:#2f3b37;
  --accent:#5fbfa8; --accent-ink:#0e1614; --accent-soft:#1f3530;
  --warn:#f0b35a; --warn-soft:#352a17; --code-bg:#0e1311; --code-ink:#dfe9e4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a18; --panel:#1c2421; --ink:#e7eeeb; --muted:#9fb0aa; --line:#2f3b37;
  --accent:#5fbfa8; --accent-ink:#0e1614; --accent-soft:#1f3530;
  --warn:#f0b35a; --warn-soft:#352a17; --code-bg:#0e1311; --code-ink:#dfe9e4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start}
header.top{max-width:1040px;margin:0 auto 22px}
header.top h1{font-family:var(--f-display);font-size:1.9rem;line-height:1.3;margin:0;text-wrap:balance}
header.top p{margin:.3rem 0 0;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
nav.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
nav.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;color:var(--muted);font-size:.95rem}
nav.steps button:hover{background:var(--accent-soft)}
nav.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
[aria-current="step"] .dot{border-color:var(--accent);color:var(--accent)}
.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
main.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 30px;min-width:0}
.where{display:inline-block;font-size:.78rem;letter-spacing:.06em;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 10px;border-radius:99px;margin-bottom:8px}
main h2{font-family:var(--f-display);font-size:1.55rem;line-height:1.35;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px}
ol.do{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:12px;counter-reset:n}
ol.do>li{counter-increment:n;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
ol.do>li::before{content:counter(n);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:.85rem;font-weight:700;margin-top:1px}
b,strong{font-weight:700}
kbd{font-family:var(--f-mono);font-size:.85em;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--bg)}
.ui{font-weight:700;background:var(--accent-soft);padding:0 6px;border-radius:4px}
.tip,.warn{border-radius:10px;padding:12px 16px;margin:0 0 16px;font-size:.95rem}
.tip{background:var(--accent-soft)}
.warn{background:var(--warn-soft);color:var(--ink)}
.warn b{color:var(--warn)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:9px;font-weight:700;font-size:.95rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a.btn{text-decoration:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.big{font-family:var(--f-mono);font-size:1.45rem;font-weight:500;letter-spacing:.02em;background:var(--bg);border:2px dashed var(--accent);border-radius:10px;padding:14px 18px;word-break:break-all;margin:0 0 12px}
label{font-weight:700;font-size:.92rem}
input[type=text]{font:inherit;font-family:var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:min(260px,100%)}
input:focus-visible{outline:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 14px}
.seg button{all:unset;cursor:pointer;padding:8px 18px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
pre.code{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.78rem;line-height:1.55;padding:16px;border-radius:10px;max-height:300px;overflow:auto;margin:0 0 14px;white-space:pre}
.hl{background:#f0b35a;color:#1b1406;border-radius:3px;padding:0 2px}
table{border-collapse:collapse;width:100%;font-size:.93rem;margin:0 0 16px}
.tw{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font-size:.8rem;letter-spacing:.05em;color:var(--muted)}
.check{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin:6px 0 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
footer.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0 4px}
.qr{background:#fff;padding:10px;border-radius:10px;line-height:0;border:1px solid var(--line)}
.qr img,.qr canvas{width:150px;height:150px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:9px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.status{font-family:var(--f-mono);font-size:.82rem;background:#222;color:#fff;border-radius:8px;padding:10px 14px;line-height:1.6;display:inline-block;margin:0 0 14px}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}
  nav.steps button span.t{display:none}
  nav.steps button[aria-current="step"] span.t{display:inline;white-space:nowrap}
  main.card{padding:20px 18px}
  header.top h1{font-size:1.55rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <h1>업무포털 결재 알림 설치 도우미</h1>
  <p>화면에 나오는 순서대로 하나씩 따라 하시면 됩니다. 약 15분 걸립니다.</p>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<div class="wrap">
  <nav class="steps" id="nav" aria-label="설치 단계"></nav>
  <main class="card" id="card" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="text/plain" id="code">
// ==UserScript==
// @name         업무포털 결재 알림
// @namespace    gne-eduptl-alarm
// @version      1.5
// @description  업무포털 메인 화면을 1분마다 확인해 결재·메모·메일 등이 있으면 PC 음성 안내(조용한 시간·공휴일 제외) + 휴대폰(ntfy) 알림(새로 생겼을 때 한 번)
// @match        https://gne.eduptl.kr/bpm_man_mn00_001.do*
// @grant        none
// @run-at       document-idle
// ==/UserScript==

(function () {
  'use strict';

  // ===== 설정 (숫자만 바꾸면 됩니다) =====
  const TOPIC = 'https://ntfy.sh/여기에-내-채널이름'; // ★ 휴대폰 ntfy 채널 이름으로 바꾸기
  const CHECK_MIN = 1;          // 확인 간격(분)
  const EXTEND_UNDER_MIN = 10;  // 남은 로그인 시간이 이보다 적으면 자동 연장(분)
  const QUIET_START = 20;       // PC 음성 끄는 시작 시각 (20시)
  const QUIET_END = 7;          // PC 음성 다시 켜는 시각 (7시)
  const QUIET_WEEKEND = true;   // 토·일 내내 PC 음성 끔
  const QUIET_HOLIDAY = true;   // 공휴일(대체공휴일 포함) 내내 PC 음성 끔
  // =====================================

  // ===== 공휴일 자동 계산 (해마다 손댈 필요 없음) =====
  // 설날·부처님오신날·추석은 크롬의 음력 계산 기능으로 구하고, 대체공휴일 규칙도 적용합니다.
  const _holCache = {};
  function ymd(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function holidaysOf(Y) {
    if (_holCache[Y]) return _holCache[Y];
    const fmt = new Intl.DateTimeFormat('en-u-ca-chinese', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric' });
    const lunarDay = {}; // '1-1' → 양력 날짜
    for (let d = new Date(Y, 0, 1); d.getFullYear() === Y; d.setDate(d.getDate() + 1)) {
      const p = {};
      fmt.formatToParts(d).forEach(x => { p[x.type] = x.value; });
      if (/^\d+$/.test(p.month)) lunarDay[p.month + '-' + p.day] = new Date(d);
    }
    const shift = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const list = []; // [날짜, 대체 규칙] — W: 토·일·겹침 시 대체, S: 일요일·겹침 시 대체, N: 대체 없음
    const add = (d, rule) => { if (d) list.push([d, rule]); };
    add(new Date(Y, 0, 1), 'N');                 // 신정
    add(new Date(Y, 2, 1), 'W');                 // 삼일절
    add(new Date(Y, 4, 5), 'W');                 // 어린이날
    add(new Date(Y, 5, 6), 'N');                 // 현충일
    add(new Date(Y, 6, 17), 'W');                // 제헌절
    add(new Date(Y, 7, 15), 'W');                // 광복절
    add(new Date(Y, 9, 3), 'W');                 // 개천절
    add(new Date(Y, 9, 9), 'W');                 // 한글날
    add(new Date(Y, 11, 25), 'W');               // 성탄절
    const seol = lunarDay['1-1'], chu = lunarDay['8-15'];
    if (seol) [-1, 0, 1].forEach(n => add(shift(seol, n), 'S'));   // 설날 연휴
    add(lunarDay['4-8'], 'W');                   // 부처님오신날
    if (chu) [-1, 0, 1].forEach(n => add(shift(chu, n), 'S'));     // 추석 연휴
    list.sort((a, b) => a[0] - b[0]);

    const set = new Set(), seen = {};
    let need = []; // 대체공휴일이 필요한 원래 날짜
    list.forEach(([d, rule]) => {
      const k = ymd(d), w = d.getDay();
      const overlap = seen[k];
      seen[k] = true;
      set.add(k);
      if (rule === 'N') return;
      if (overlap || w === 0 || (rule === 'W' && w === 6)) need.push(d);
    });
    // 대체공휴일: 설·추석은 연휴가 끝난 뒤, 나머지는 그날 다음의 첫 평일(공휴일 아닌 날)
    need.forEach(d => {
      let x = new Date(d);
      do { x = shift(x, 1); } while (x.getDay() === 0 || x.getDay() === 6 || set.has(ymd(x)));
      set.add(ymd(x));
    });
    return (_holCache[Y] = set);
  }
  function holiday() {
    const d = new Date();
    try { return QUIET_HOLIDAY && holidaysOf(d.getFullYear()).has(ymd(d)); } catch (e) { return false; }
  }

  // 지금이 조용한 시간인지 확인
  function quiet() {
    const d = new Date(), h = d.getHours(), w = d.getDay();
    return (QUIET_WEEKEND && (w === 0 || w === 6)) || holiday() || h >= QUIET_START || h < QUIET_END;
  }

  // 화면에서 항목 값 읽기
  function val(label) {
    const li = [...document.querySelectorAll('.mct-top-area li')]
      .find(l => l.innerText.replace(/\s+/g, ' ').trim().startsWith(label));
    return li ? li.innerText.replace(label, '').replace(/\s+/g, '').trim() : '';
  }

  // "3(1)" 형태를 [3, 1]로
  function pair(v) {
    const m = (v || '').match(/(\d+)\((\d+)\)/);
    return m ? [+m[1], +m[2]] : [0, 0];
  }

  // PC 음성 안내 (조용한 시간에는 안 함)
  function say(t) {
    if (quiet()) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'ko-KR';
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  let status = '-', lastExt = '-', lastPush = '-', lastCheck = '-', warned = false, prev = {};
  let timerCheck = null, timerSession = null;
  let paused = false;   // [중지]를 누르면 true
  let cur = {};         // 마지막으로 읽은 건수
  let unacked = [];     // 아직 [확인했음]을 누르지 않은 항목

  // [확인했음]을 누른 건수 기억 (새로고침해도 유지)
  let ack = {};
  try { ack = JSON.parse(localStorage.getItem('gyeoljae-ack') || '{}'); } catch (e) {}
  function saveAck() { try { localStorage.setItem('gyeoljae-ack', JSON.stringify(ack)); } catch (e) {} }

  // 휴대폰 알림 (시간 제한 없음)
  function push(msg) {
    fetch(TOPIC, {
      method: 'POST',
      headers: { 'Priority': 'urgent', 'Tags': 'bell' },
      body: msg
    }).then(r => {
      lastPush = new Date().toLocaleTimeString('ko-KR') + (r.ok ? ' 전송' : ' 실패');
      render();
    }).catch(() => { lastPush = '전송 실패'; render(); });
  }

  // 남은 로그인 시간(초)
  function left() {
    const m = document.body.innerText.match(/(\d+):(\d+)\s*후에\s*로그아웃/);
    return m ? (+m[1]) * 60 + (+m[2]) : null;
  }

  // 오른쪽 아래 상태 상자
  const box = document.createElement('div');
  box.id = '__monbox';
  box.style.cssText = 'position:fixed;right:110px;bottom:20px;z-index:99999;background:#222;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:0 2px 8px #0008';
  document.body.appendChild(box);

  const BTN = 'margin-top:6px;margin-right:6px;padding:2px 8px;border-radius:3px;border:1px solid #999;background:#eee;color:#111;cursor:pointer;font-size:12px';
  function render() {
    let mode;
    if (paused) mode = '⏸ 멈춤 (알림·로그인 연장 꺼짐)';
    else if (quiet()) mode = holiday() ? '🌙 공휴일 (음성 꺼짐, 휴대폰만)' : '🌙 조용한 시간 (음성 꺼짐, 휴대폰만)';
    else if (status !== '해당 없음' && status !== '-' && !unacked.length) mode = '🔕 확인한 알림 (음성 꺼짐)';
    else mode = '🔔 결재 알림 작동 중 (음성+휴대폰)';
    let btns = '';
    if (!paused && unacked.length)
      btns += '<button data-act="ack" style="' + BTN + ';background:#ffd54a;border-color:#c9a400;font-weight:700">확인했음 (음성 끄기)</button>';
    btns += paused
      ? '<button data-act="resume" style="' + BTN + ';background:#7fd6b4;border-color:#3a9;font-weight:700">다시 시작</button>'
      : '<button data-act="stop" style="' + BTN + '">중지</button>';
    box.innerHTML = mode +
      '<br>마지막 확인: ' + lastCheck +
      '<br>' + status +
      '<br>로그인 연장: ' + lastExt +
      '<br>휴대폰 알림: ' + lastPush +
      '<br>' + btns;
  }

  box.addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === 'ack') {           // 지금 건수까지는 확인한 것으로 기억
      ack = Object.assign({}, cur);
      saveAck();
      unacked = [];
      speechSynthesis.cancel();
      status = status.replace(/<\/?b[^>]*>/g, '').replace('알림: ', '') + ' <span style="color:#7fd6b4">· 확인함</span>';
    } else if (act === 'stop') {   // 모두 멈춤
      paused = true;
      speechSynthesis.cancel();
    } else if (act === 'resume') { // 다시 시작
      paused = false;
      run();
      session();
    }
    render();
  });

  // 로그인 유지 확인
  function session() {
    if (paused) return;
    const l = left();
    if ((l === null || l <= 90) && !warned) {
      const w = '곧 로그아웃됩니다. 업무포털을 확인해 주세요.';
      say(w);
      push(w);
      warned = true;
    }
    if (l !== null && l < EXTEND_UNDER_MIN * 60) {
      document.querySelector('.session-info .btn-refresh')?.click();
      lastExt = new Date().toLocaleTimeString('ko-KR');
      setTimeout(() => {
        const n = left();
        if (n !== null && n > l) warned = false;
      }, 3000);
    }
    render();
  }

  // "세션종료까지 ... 연장하시겠습니까?" 창이 뜨면 자동으로 [확인] 누르기
  function autoConfirm() {
    if (paused) return;
    const msg = document.getElementById('swal2-html-container');
    if (!msg || !/세션종료까지[\s\S]*연장/.test(msg.innerText || '')) return;
    const btn = document.querySelector('.swal2-popup .swal2-confirm');
    if (btn && btn.offsetParent !== null) {
      btn.click();
      lastExt = new Date().toLocaleTimeString('ko-KR') + ' (창 확인)';
      warned = false;
      render();
    }
  }

  // 결재 등 확인
  function check() {
    const [a, ae] = pair(val('결재(긴급)'));
    const [b, be] = pair(val('메모(긴급)'));
    let ds = 0;
    ['내부승인(요청)', '카드권한(요청)', '데이터취합(내담당)', '내부승인(처리)', '카드권한(처리)', '설문']
      .forEach(k => { ds += parseInt(val(k)) || 0; });

    cur = {
      '나이스 미결/협조': parseInt(val('미결/협조함')) || 0,
      '결재': a,
      '긴급 결재': ae,
      '메모': b,
      '긴급 메모': be,
      '메일': parseInt(val('메일')) || 0,
      '데이터통합관리 알림': ds
    };

    const words = Object.entries(cur).filter(([k, v]) => v > 0).map(([k, v]) => k + ' ' + v + '건');
    const isNew = Object.keys(cur).some(k => cur[k] > (prev[k] || 0));
    prev = cur;

    lastCheck = new Date().toLocaleTimeString('ko-KR');
    // 처리해서 줄어든 건은 확인 기록도 같이 줄임
    Object.keys(ack).forEach(k => { if ((cur[k] || 0) < ack[k]) ack[k] = cur[k] || 0; });
    saveAck();
    unacked = Object.keys(cur).filter(k => cur[k] > (ack[k] || 0));

    if (!words.length) status = '해당 없음';
    else if (unacked.length) status = '<b style="color:#ff6">알림: ' + words.join(', ') + '</b>';
    else status = words.join(', ') + ' <span style="color:#7fd6b4">· 확인함</span>';
    render();

    if (words.length) {
      if (unacked.length) say(words.join(', ') + '이 있습니다. 확인해 주세요.');           // PC: 1분마다 (조용한 시간·공휴일 제외)

    }
  }

  function run() {
    if (paused) return;
    ['btnRefreshNeisAprvWork', 'btnRefreshKedu', 'btnRefreshEdmgr']
      .forEach(id => document.getElementById(id)?.click());
    setTimeout(check, 5000);
  }

  render();
  setTimeout(() => {
    timerCheck = setInterval(run, CHECK_MIN * 60 * 1000);
    timerSession = setInterval(session, 30 * 1000);
    setInterval(autoConfirm, 2000); // 2초마다 연장 창 확인
    run();
    session();
  }, 5000); // 화면이 다 뜬 뒤 시작
})();
</script>

    <tr><td><b>검은 상자가 안 뜸</b></td><td>③단계 "사용 허용"이 켜져 있는지 → 탬퍼몽키 대시보드에서 스크립트가 켜짐인지 → 업무포털 <b>메인 화면</b>에서 <kbd>F5</kbd></td></tr>
    <tr><td><b>음성이 안 나옴</b></td><td>화면을 한 번 클릭했는지, 조용한 시간(평일 20~07시, 주말·공휴일)인지, 스피커 음량</td></tr>
    <tr><td><b>휴대폰 알림이 안 옴</b></td><td>검은 상자의 "휴대폰 알림"이 <b>전송 실패</b>면 학교 PC에서 ntfy 연결이 막힌 경우입니다. "전송"인데 안 오면 휴대폰 앱의 채널 이름과 알림 권한 확인</td></tr>
    <tr><td><b>알림이 두 번씩 옴</b></td><td>탬퍼몽키 대시보드에 같은 스크립트가 두 개 있는지 확인 → 하나 삭제</td></tr>
    <tr><td><b>시간을 바꾸고 싶음</b></td><td>탬퍼몽키에서 코드를 열어 위쪽 <code>QUIET_START</code>(20), <code>QUIET_END</code>(7) 숫자만 바꾸고 <kbd>Ctrl</kbd>+<kbd>S</kbd></td></tr>
  </table></div>
  <div class="tip">경남교육청 업무포털(gne.eduptl.kr) 전용입니다. 업무용 PC 사용에 관한 소속 기관 정보보안 지침은 각자 확인해 주세요.</div>
  <p style="font-family:var(--f-display);font-size:1.3rem;margin:20px 0 0">설치가 끝났습니다. 수고하셨습니다.</p>`}
];

const nav=document.getElementById('nav'),card=document.getElementById('card');
function render(focus){
  const n=STEPS.length,i=S.step;
  nav.innerHTML=STEPS.map((s,k)=>`<button data-go="${k}" ${k===i?'aria-current="step"':''} class="${S.done[k]?'done':''}"><span class="dot">${S.done[k]?'✓':k+1}</span><span class="t">${s.t}</span></button>`).join('');
  const s=STEPS[i];
  card.innerHTML=`<span class="where">${i+1} / ${n} 단계 · ${where[s.w]}</span>${s.h()}
    ${i<n-1?`<label class="check"><input type="checkbox" id="chk" ${S.done[i]?'checked':''}> 이 단계를 마쳤습니다</label>`:''}
    <footer class="nav"><button class="btn ghost" id="prev" ${i===0?'hidden':''}>← 이전</button><span></span>
    ${i<n-1?`<button class="btn" id="next">다음 단계 →</button>`:`<button class="btn ghost" id="restart">처음으로</button>`}</footer>`;
  document.getElementById('bar').style.width=(Object.keys(S.done).filter(k=>S.done[k]).length/(n-1)*100)+'%';
  const cv=document.getElementById('codeView');
  if(cv){cv.innerHTML=esc(myCode()).replace(esc(S.topic),'<span class="hl">'+esc(S.topic)+'</span>');}
  const qr=document.getElementById('qr');
  if(qr&&window.QRCode){try{new QRCode(qr,{text:S.topic,width:150,height:150,colorDark:'#000000',colorLight:'#ffffff'});}catch(e){qr.remove();}}else if(qr){qr.parentElement.remove();}
  if(focus){card.focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'});}
  save();
}
function go(k){S.step=Math.max(0,Math.min(STEPS.length-1,k));render(true);}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,input');if(!t)return;
  if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.id==='next'){S.done[S.step]=true;go(S.step+1);}
  else if(t.id==='prev')go(S.step-1);
  else if(t.id==='restart')go(0);
  else if(t.id==='chk'){S.done[S.step]=t.checked;render();}
  else if(t.dataset.copy)copy(t.dataset.copy,'주소를 복사했습니다');
  else if(t.hasAttribute('data-copy-topic'))copy(S.topic,'채널 이름을 복사했습니다');
  else if(t.id==='regen'){S.topic=makeTopic((document.getElementById('pre')||{}).value);render();toast('새 이름을 만들었습니다');}
  else if(t.id==='apply'){S.topic=makeTopic(document.getElementById('pre').value);render();toast('이니셜을 넣었습니다');}
  else if(t.dataset.phone){S.phone=t.dataset.phone;render();}
  else if(t.id==='copyCode')copy(myCode(),'코드를 복사했습니다. 탬퍼몽키에 붙여 넣으세요');
});
render();
})();
</script>
